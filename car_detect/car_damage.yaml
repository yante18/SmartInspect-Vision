# Car Damage Detection Dataset Configuration
# YOLOv8 数据集配置文件

# 数据集根路径（相对于项目目录）
path: ./datasets/car-damage-dataset

# 训练集和验证集路径（相对于 path）
train: images/train
val: images/val

# 类别数量
nc: 34

# 类别名称
names:
  0: 车门与翼子板的接缝处错位
  1: 后翼子板撕裂
  2: 车漆刮擦破损
  3: 车门与翼子板的接线处错位
  4: 车门撕裂
  5: 车门大面积凹陷
  6: 中网损坏
  7: 前保险杠脱落
  8: 车灯支架损坏
  9: 后保险杠撕裂破损
  10: 尾灯灯罩破损
  11: 前挡风玻璃破损
  12: 引擎盖翘起变形
  13: 车灯破损
  14: 后保险杠损坏
  15: 车尾严重溃缩变形
  16: 排气系统脱落
  17: 翼子板撕裂
  18: 翼子板凹陷
  19: 翼子板撕裂、凹陷
  20: 水箱框架、前纵梁严重溃缩变形
  21: 后备箱盖损坏
  22: 后翼子板脱落
  23: 车顶凹陷
  24: 线束外露
  25: 后备箱盖溃缩变形
  26: 排气管外露
  27: 水箱框架外露
  28: 保险杠撕裂
  29: 轮毂、悬挂部件损坏
  30: 轮胎脱落
  31: 后保险杠脱落
  32: 车门凹陷
  33: 前保险杠撕裂

# 数据增强策略（训练时自动应用）
hsv_h: 0.015    # 色调扰动
hsv_s: 0.7      # 饱和度扰动
hsv_v: 0.4      # 亮度扰动
degrees: 5      # 旋转角度（±5度）
translate: 0.2  # 平移比例
scale: 0.5      # 缩放范围
flipud: 0.0     # 垂直翻转概率
fliplr: 0.5     # 水平翻转概率
mosaic: 1.0     # Mosaic 增强概率
