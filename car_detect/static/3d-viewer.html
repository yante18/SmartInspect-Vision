<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智检慧眼 - 3D 车辆模型展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container canvas {
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .nav a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 14px 24px;
            border-radius: 10px;
            backdrop-filter: blur(15px);
            transition: all 0.3s;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .tip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 14px;
            color: #e0e0e0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 24px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 100;
            max-width: 320px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .info-panel h3 {
            color: #ff6b6b;
            margin-bottom: 14px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel p {
            color: #b0b0b0;
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <canvas id="gradient-bg"></canvas>
    <div id="canvas-container">
        <div id="loading">🚗 加载中...</div>
        
        <div class="nav">
            <a href="/">← 返回检测页面</a>
        </div>

        <div class="info-panel">
            <h3>🚗 小米 SU7 Max</h3>
            <p>• 鼠标左键拖拽：旋转模型</p>
            <p>• 鼠标滚轮：缩放大小</p>
            <p>• 鼠标右键拖拽：平移视角</p>
        </div>

        <div class="tip">
            使用鼠标与 3D 模型交互 | 真实小米 SU7 3D 模型
        </div>
    </div>

    <!-- 引入 Three.js (使用 ES Modules) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        // 引入 Three.js 模块
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // 场景、相机、渲染器
        let scene, camera, renderer, controls;
        let carGroup;

        // 绘制渐变背景
        function drawGradientBackground() {
            const canvas = document.getElementById('gradient-bg');
            const ctx = canvas.getContext('2d');
            
            // 设置画布大小
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 创建渐变 - 专业汽车展示厅风格
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2d3436');   // 顶部深色
            gradient.addColorStop(0.3, '#636e72'); // 中上部灰色
            gradient.addColorStop(0.6, '#dfe6e9'); // 中下部浅灰
            gradient.addColorStop(1, '#ffffff');   // 底部白色
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 初始化
        async function init() {
            // 绘制背景
            drawGradientBackground();
            window.addEventListener('resize', drawGradientBackground);
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = null;  // 透明背景，让Canvas渐变透出来
            scene.fog = new THREE.Fog(0x636e72, 10, 50);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(
                50,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(6, 3, 6);

            // 创建渲染器 - 开启透明背景
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 添加轨道控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 20;
            controls.maxPolarAngle = Math.PI / 2;

            // 添加灯光
            setupLights();

            // 创建地面
            createGround();

            // 加载真实的 3D 汽车模型
            await loadCarModel();

            // 隐藏加载提示
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);

            // 开始渲染循环
            animate();
        }
        
        // 加载真实的 GLTF 汽车模型
        function loadCarModel() {
            return new Promise((resolve, reject) => {
                const loader = new GLTFLoader();
                
                // 模型路径
                const modelPath = "/static/2024_xiaomi_su7_max/scene.gltf";
                
                console.log('开始加载 3D 模型:', modelPath);
                
                let loadTimeout = setTimeout(() => {
                    console.warn('模型加载超时，使用占位模型');
                    createPlaceholderCar();
                    resolve();
                }, 15000); // 15秒超时

                loader.load(
                    modelPath,
                    (gltf) => {
                        clearTimeout(loadTimeout);
                        console.log('模型加载成功!', gltf);
                        
                        carGroup = new THREE.Group();
                        
                        // 添加模型到组
                        carGroup.add(gltf.scene);
                        
                        // 设置模型属性
                        gltf.scene.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                
                                // 优化材质
                                if (child.material) {
                                    child.material.envMapIntensity = 1.0;
                                    // 确保材质双面可见
                                    child.material.side = THREE.DoubleSide;
                                }
                            }
                        });

                        // 计算模型边界
                        const box = new THREE.Box3().setFromObject(gltf.scene);
                        const size = box.getSize(new THREE.Vector3());
                        const center = box.getCenter(new THREE.Vector3());
                        
                        console.log('原始模型尺寸:', size);
                        console.log('原始模型中心:', center);

                        // 模型原始缩放只有 0.01，需要放大 100 倍！
                        const scale = 100.0;
                        carGroup.scale.set(scale, scale, scale);
                        
                        // 将模型居中并抬高
                        carGroup.position.x = -center.x * scale;
                        carGroup.position.y = -center.y * scale + 1.0; // 抬高一点让轮子接触地面
                        carGroup.position.z = -center.z * scale;
                        
                        // 旋转模型让车头朝向正确方向（绕Y轴旋转90度）
                        carGroup.rotation.y = Math.PI / 2;
                        
                        scene.add(carGroup);
                        
                        console.log('模型已添加到场景，缩放:', scale);
                        console.log('位置:', carGroup.position);
                        console.log('旋转:', carGroup.rotation);
                        
                        // 隐藏加载提示
                        document.getElementById('loading').style.display = 'none';
                        resolve();
                    },
                    (progress) => {
                        // 加载进度
                        if (progress.lengthComputable) {
                            const percent = (progress.loaded / progress.total * 100).toFixed(0);
                            document.getElementById('loading').innerHTML = `
                                🚗 加载中... ${percent}%
                            `;
                            console.log('加载进度:', percent + '%');
                        } else {
                            // 如果无法计算进度，显示加载中
                            document.getElementById('loading').innerHTML = `
                                🚗 加载中...
                            `;
                        }
                    },
                    (error) => {
                        clearTimeout(loadTimeout);
                        console.error('模型加载失败:', error);
                        // 加载失败时创建简单占位模型
                        console.log('使用占位模型');
                        createPlaceholderCar();
                        resolve();
                    }
                );
            });
        }
        
        // 创建占位汽车模型（当GLTF加载失败时）
        function createPlaceholderCar() {
            carGroup = new THREE.Group();
            
            // 创建简单的汽车形状
            const bodyGeometry = new THREE.BoxGeometry(3, 1, 1.4);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: 0x3498db,
                roughness: 0.2,
                metalness: 0.9
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.7;
            body.castShadow = true;
            carGroup.add(body);

            // 车顶
            const roofGeometry = new THREE.BoxGeometry(1.8, 0.6, 1.2);
            const roof = new THREE.Mesh(roofGeometry, bodyMaterial);
            roof.position.y = 1.3;
            roof.castShadow = true;
            carGroup.add(roof);

            scene.add(carGroup);
            console.log('占位模型已创建');
            
            // 隐藏加载提示
            document.getElementById('loading').style.display = 'none';
        }

        // 设置灯光
        function setupLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // 主光源（太阳）
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(15, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 4096;
            mainLight.shadow.mapSize.height = 4096;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 50;
            mainLight.shadow.camera.left = -15;
            mainLight.shadow.camera.right = 15;
            mainLight.shadow.camera.top = 15;
            mainLight.shadow.camera.bottom = -15;
            mainLight.shadow.bias = -0.0001;
            scene.add(mainLight);

            // 环境光球
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcccccc, 0.3);
            hemiLight.position.set(0, 10, 0);
            scene.add(hemiLight);
        }

        // 创建地面
        function createGround() {
            // 地面网格 - 浅灰色
            const gridHelper = new THREE.GridHelper(30, 60, 0xcccccc, 0xe0e0e0);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // 反光地面 - 灰白色
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0xf0f0f0,
                roughness: 0.6,
                metalness: 0.1,
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.001;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        // 动画循环
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // 轻微的汽车浮动动画
            if (carGroup) {
                carGroup.position.y = Math.sin(time * 0.5) * 0.02;
                carGroup.rotation.y = Math.sin(time * 0.2) * 0.02;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动
        init();
    </script>
</body>
</html>
